<section>
<h2>اليوم 1: الأنماط والثقة المعايَرة</h2>
<ol>
<li><p>في إدارة التوصيلات الجديدة، يكتب نظام خطاب الموافقة على طلب توصيل كاملًا، ويظهر للمهندس مع زر «اعتماد وإرسال»، فيصل إلى المقاول. كيف تصنفه؟</p><ul><li><b>أ.</b> مضمّن، مستوى 1</li><li><b>ب.</b> صياغة ثم مراجعة، مستوى 2</li><li><b>ج.</b> مهام بعد الموافقة، مستوى 3</li><li><b>د.</b> مهام في الخلفية، مستوى 4</li></ul></li>
<li><p>في إدارة التوصيلات الجديدة، يرفض نظام في الخلفية طلبات التوصيل الناقصة ويُبلغ المقاول، وثلث الرفض كان خطأً كلّف المقاولين مواعيد الحفر. أي إجراء يعالج الخطر؟</p><ul><li><b>أ.</b> إرسال الإشعار إلى المقاول برسالة نصية فورية بدل البريد</li><li><b>ب.</b> نشر دليل للمقاولين عن الطلب المكتمل</li><li><b>ج.</b> رفع عتبة الثقة التي يرفض عندها النظام</li><li><b>د.</b> عرض الرفض على مهندس يؤكده قبل أن يصل إلى المقاول</li></ul></li>
<li><p>في تقييم مساعد إدارة التوصيلات الجديدة، متوسط الثقة 0.91 في الردود الصحيحة و0.89 في الخاطئة، وربع الردود الخاطئة ثقتها فوق 0.95. ما القرار؟</p><ul><li><b>أ.</b> لا يُعرض الرقم، وتُوضع إشارات بحسب الموضوع</li><li><b>ب.</b> يُعرض بكلمات بدل الرقم: ثقة عالية أو متوسطة أو منخفضة</li><li><b>ج.</b> يُعرض الرقم كما يخرجه النموذج، فمتوسطه فوق 0.85</li><li><b>د.</b> يُعرض مع شرح لمعناه في شاشة التعريف</li></ul></li>
<li><p>تقييم مساعد التوصيلات الجديدة: حالة الطلب 95%، واشتراطات المخطط 52% وأخطاؤها أرقام أقطار مخترعة. أي تصميم لرد عن الاشتراطات يطابق الدليل؟</p><ul><li><b>أ.</b> سطر «قد يخطئ المساعد، تحقق من المعلومات المهمة» تحت كل رد في كل المواضيع</li><li><b>ب.</b> نسبة «دقة 52%» تحت ردود الاشتراطات</li><li><b>ج.</b> إشارة تحت ردود الاشتراطات: «يقرها المهندس، أرفق المخطط»</li><li><b>د.</b> إيقاف المساعد في كل المواضيع حتى ترتفع دقة الاشتراطات</li></ul></li>
<li><p>في مركز اتصال الفوترة، يقترح نظام على الموظف ثلاث جمل رد أثناء المحادثة، فيختار منها أو يكتب غيرها ثم يرسل. كيف تصنفه؟</p><ul><li><b>أ.</b> مضمّن، مستوى 1</li><li><b>ب.</b> محادثة، مستوى 0</li><li><b>ج.</b> صياغة ثم مراجعة، مستوى 2</li><li><b>د.</b> مهام في الخلفية، مستوى 4</li></ul></li>
<li><p>منصة بلاغات الأعطال تغلق البلاغ تلقائيًا إذا لم يرد صاحبه خلال يومين، ويُعاد فتحه بطلب جديد يبدأ من آخر الطابور. ما قابلية التراجع عن الإغلاق؟</p><ul><li><b>أ.</b> ق1: يُعاد فتح البلاغ بلا تكلفة</li><li><b>ب.</b> لا إجراء: النظام يعرض حالة البلاغ فقط</li><li><b>ج.</b> ق3: الإغلاق لا يُتراجع عنه</li><li><b>د.</b> ق2: يُعاد فتحه بتكلفة على صاحبه</li></ul></li>
<li><p>في سجل مُعدّ ردود البريد في مركز اتصال الفوترة: 400 رد، منها 30 فيها خطأ، و27 من هذه الثلاثين أُرسلت دون تعديل. أي رقم يقول إن المراجعة شكلية ومكلفة؟</p><ul><li><b>أ.</b> 30 من 400، أي 7.5% من الردود فيها خطأ</li><li><b>ب.</b> 27 من 30، أي 90% من الردود الخاطئة وصلت</li><li><b>ج.</b> 27 من 400، أي نحو 7% من كل الردود</li><li><b>د.</b> 373 من 400 ردًا سليمًا وصلت</li></ul></li>
<li><p>حين تنفذ أداة إجراءً في الخلفية أثره ق2، يكفي أن يصل إشعار سريع إلى المستخدم بعد التنفيذ ليُعالج خطر الثقة.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>تقييم مساعد قسم جودة المياه: الإجمالي 81%. أسئلة مواعيد أخذ العينات 93% (60 بندًا)، وأسئلة تفسير نتائج التحليل 46% (24 بندًا). ماذا يقول بيان القدرة؟</p><ul><li><b>أ.</b> يجيد المساعد أسئلة الجودة بنسبة 81%</li><li><b>ب.</b> لا يُعتمد عليه في الجودة كلها حتى تتحسن النتائج</li><li><b>ج.</b> يجيد المواعيد، ويضعف في التفسير (من 24 بندًا)</li><li><b>د.</b> تفسير النتائج 46%، فتُعرض النسبة تحت كل رد</li></ul></li>
<li><p>مساعد مركز اتصال الفوترة يخترع أحيانًا تواريخ قطع الخدمة. أي تصميم لرده عن موعد القطع يطابق هذا الدليل؟</p><ul><li><b>أ.</b> التاريخ من سجل الحساب ومعه رابطه، أو موظف</li><li><b>ب.</b> التاريخ كما يكتبه المساعد، وتحته سطر «قد أخطئ»</li><li><b>ج.</b> التاريخ مع رقم ثقة النموذج بجانبه</li><li><b>د.</b> إخفاء موضوع الفواتير كله من المساعد</li></ul></li>
<li><p>إذا كان متوسط ثقة النموذج في ردوده الصحيحة قريبًا من متوسطه في ردوده الخاطئة، فعرض الرقم للمستخدمين لا يساعدهم على الحكم.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: الإفصاح والتعافي والتحويل</h2>
<ol>
<li><p>في إدارة التوصيلات الجديدة، يحدد نظام في الخلفية موعد فحص الموقع ويرسله إلى المقاول، ويستطيع المقاول تغييره بعد ذلك برسوم. أين يقع على المقياسين؟</p><ul><li><b>أ.</b> مستوى 1، ق1</li><li><b>ب.</b> مستوى 4، ق1</li><li><b>ج.</b> مستوى 4، ق2</li><li><b>د.</b> مستوى 3، ق3</li></ul></li>
<li><p>بوابة مقاولي التوصيلات تعرض زر «تحدث إلى موظف» في صفحة الإعدادات فقط. أي تغيير يحقق القناة البديلة غير الآلية التي اعتمدتها صيّب من المبادئ التوجيهية؟</p><ul><li><b>أ.</b> يعرض المساعد الزر بعد أن يفشل مرتين</li><li><b>ب.</b> رقم الهاتف في صفحة الأسئلة الشائعة</li><li><b>ج.</b> اسم «مساعد آلي» في رأس المحادثة</li><li><b>د.</b> زر ظاهر في كل شاشة محادثة</li></ul></li>
<li><p>في بوابة المقاولين، يكتب مقاول «ارفع المخطط المعدل» فيدور المؤشر 35 ثانية، ثم تظهر «حدث خطأ»، والمخطط رُفع فعلًا. ما النوع والحالة المناسبة؟</p><ul><li><b>أ.</b> بطيء؛ مؤشر يقول ما يحدث، ثم «تم رفع المخطط» صراحة</li><li><b>ب.</b> خاطئ؛ زر «الرد غير صحيح» بجانب رسالة الخطأ</li><li><b>ج.</b> رفض غير مناسب؛ نص يشرح لماذا لا يُرفع المخطط</li><li><b>د.</b> خارج النطاق؛ رابط إلى صفحة رفع المخططات</li></ul></li>
<li><p>وكيل بوابة المقاولين يغيّر لغة الإشعارات التي تصل المقاول من العربية إلى الإنجليزية حين يطلب ذلك، ويعيدها المقاول بنقرة في أي وقت دون أي أثر على غيره. أي مستوى؟</p><ul><li><b>أ.</b> م1: معاينة ما سيحدث ثم نقرة واحدة</li><li><b>ب.</b> م0: ينفذ ثم يُبلغ مع زر تراجع</li><li><b>ج.</b> م2: تأكيد صريح يذكر الأثر</li><li><b>د.</b> م3: موافقة موظف قبل التنفيذ</li></ul></li>
<li><p>مقاول يشتكي في بوابة التوصيلات من مهندس رفض مخططه دون سبب، ويطلب موظفًا. أي بطاقة تحويل تطابق القواعد؟</p><ul><li><b>أ.</b> ملخص المساعد للشكوى في سطر، مع سجل المقاول</li><li><b>ب.</b> كلمات المقاول، وما جرّبه المساعد، بعد سؤاله عن النقل</li><li><b>ج.</b> المحادثة كاملة، وكل طلبات المقاول السابقة ومراسلاته مع المهندسين</li><li><b>د.</b> بطاقة فارغة، ليبدأ الموظف دون تأثر بالمساعد</li></ul></li>
<li><p>بوابة المقاولين تعرض مساعدها باسم «نورة» وصورة موظفة. أي قاعدة تحكم تغيير ذلك؟</p><ul><li><b>أ.</b> قاعدة الجهة في الموافقة على مشاركة البيانات</li><li><b>ب.</b> الإفصاح وعدم الخداع في النصوص الوطنية</li><li><b>ج.</b> معيار التباين في WCAG</li><li><b>د.</b> لا قاعدة؛ الاسم قرار تسويقي</li></ul></li>
<li><p>مساعد منصة البلاغات لا يقرر التعويض عن تلف بسبب الانقطاع؛ يقرره فريق المطالبات. أي رد يناسب سؤال «هل يحق لي تعويض؟»</p><ul><li><b>أ.</b> عذرًا، لا أستطيع المساعدة في هذا الطلب.</li><li><b>ب.</b> نعم، يحق لك تعويض عن التلف بحسب الأنظمة.</li><li><b>ج.</b> هذا خارج نطاقي. ابحث في الموقع.</li><li><b>د.</b> يقرره فريق المطالبات. أفتح لك طلبًا؟</li></ul></li>
<li><p>وكيل بوابة المقاولين سيسحب طلب توصيل؛ تُسترد رسوم الدراسة 300 ريال خلال عشرة أيام عمل، ويحتاج الطلب الجديد إلى دراسة جديدة. أي نص تأكيد؟</p><ul><li><b>أ.</b> هل أنت متأكد أنك تريد سحب طلب التوصيل؟ قد تنطبق شروط الاسترداد. نعم · لا</li><li><b>ب.</b> سأسحب الطلب: تُسترد 300 ريال خلال عشرة أيام، ويحتاج الطلب الجديد دراسة. اسحب الطلب · رجوع</li><li><b>ج.</b> تم سحب الطلب، وتُسترد الرسوم خلال عشرة أيام عمل كما في الشروط. تراجع</li><li><b>د.</b> سحب الطلب لا يمكن التراجع عنه، ويلزمك طلب جديد بعده. موافق</li></ul></li>
<li><p>مساعد مركز اتصال الفوترة فيه زر «الرد غير صحيح». من يراجع ما يصل منه قبل أن يصبح بنودًا في التقييم القادم؟</p><ul><li><b>أ.</b> فريق الجودة، دوريًا، دون بيانات الحساب</li><li><b>ب.</b> الفريق الذي بنى المساعد، فهو أعرف به</li><li><b>ج.</b> لا أحد؛ تُضاف الملاحظات إلى التقييم تلقائيًا</li><li><b>د.</b> موظف خدمة العملاء الذي تسلم المحادثة</li></ul></li>
<li><p>بطاقة التحويل الجيدة تنقل إلى الموظف المحادثة كاملة وكل طلبات المستخدم السابقة، حتى لا يفوته شيء.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 3: الإتاحة والاتجاه والاختبار مع الناس</h2>
<ol>
<li><p>وكيل بوابة المقاولين يستطيع إلغاء موعد فحص الموقع. الموعد يُحرَّر فورًا لغيره، والإلغاء قبل الموعد بيوم بلا رسوم وبعده برسوم 200 ريال. أي تصميم يناسبه؟</p><ul><li><b>أ.</b> م0: ينفذ ثم يُبلغ، مع زر تراجع ظاهر</li><li><b>ب.</b> م3: موافقة موظف قبل الإلغاء</li><li><b>ج.</b> م1: معاينة الموعد ثم نقرة</li><li><b>د.</b> م2: تأكيد يذكر الرسوم إن وُجدت</li></ul></li>
<li><p>في بوابة المقاولين، تظهر رسالة «تم رفع المخطط» أعلى الصفحة بعد الرفع، والتركيز باقٍ على زر الرفع، ولا يقول قارئ الشاشة شيئًا. أي معيار لا يتحقق؟</p><ul><li><b>أ.</b> 2.1.1 Keyboard</li><li><b>ب.</b> 4.1.3 Status Messages</li><li><b>ج.</b> 2.4.3 Focus Order</li><li><b>د.</b> 3.3.2 Labels or Instructions</li></ul></li>
<li><p>في بوابة المقاولين، مقاول يكتب «Is the permit ready?» فتظهر علامة الاستفهام في أول السطر من جهة اليسار. ما الإصلاح؟</p><ul><li><b>أ.</b> dir="auto" على فقاعة رسالة المستخدم</li><li><b>ب.</b> جعل كل الفقاعات dir="ltr"</li><li><b>ج.</b> إضافة lang="en" على الصفحة كلها</li><li><b>د.</b> إضافة رمز تحكم خفي بعد كل رسالة</li></ul></li>
<li><p>في اختبار بوابة المقاولين، المساعد يذكر عمدًا موعد فحص يختلف عن الموعد في صفحة الطلب. أي سلوك يُسجل قبولًا للخطأ المزروع؟</p><ul><li><b>أ.</b> يتردد ثم يفتح صفحة الطلب ويصحح الموعد</li><li><b>ب.</b> يسأل الميسّر «صح كذا؟» ثم يفتح صفحة الطلب</li><li><b>ج.</b> يكتب الموعد في ملاحظاته ويغلق المهمة</li><li><b>د.</b> يقول «الموعد غريب» ويطلب موظفًا</li></ul></li>
<li><p>اختبار بوابة المقاولين: أربعة مشاركين، ثلاث مهام لكل منهم، خطأ مزروع في مهمتين من الثلاث. قبل المشاركون الخطأ المزروع 3 مرات. ما النسبة؟</p><ul><li><b>أ.</b> 3 من 12، أي 25%</li><li><b>ب.</b> 3 من 4، أي 75%</li><li><b>ج.</b> 1.5 قبول لكل خطأ مزروع</li><li><b>د.</b> 3 من 8، أي 38%</li></ul></li>
<li><p>في بوابة المقاولين، زر «رفع المخطط» أيقونة سحابة دون نص، يصلها التبويب، ويقرؤها قارئ الشاشة «زر». أي معيار؟</p><ul><li><b>أ.</b> 2.1.1 Keyboard</li><li><b>ب.</b> 4.1.2 Name, Role, Value</li><li><b>ج.</b> 1.4.3 Contrast (Minimum)</li><li><b>د.</b> 2.4.7 Focus Visible</li></ul></li>
<li><p>شغّلت فاحصًا آليًا على صفحة مساعد قسم الجودة فلم يجد مشكلات. ماذا تستنتج؟</p><ul><li><b>أ.</b> الصفحة مطابقة لمعايير WCAG 2.2 على المستوى AA</li><li><b>ب.</b> يكفي الآن اختبار التباين يدويًا</li><li><b>ج.</b> بقي اختبار لوحة المفاتيح وقارئ الشاشة</li><li><b>د.</b> الفاحص معطل، فيُعاد تشغيله بفاحص آخر</li></ul></li>
<li><p>رسالة «تم رفع المخطط» التي تظهر أعلى الصفحة دون أن ينتقل إليها التركيز يجب أن تُعلن لقارئ الشاشة، بمنطقة حية مثلًا.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>في بوابة المقاولين يظهر «رقم الرخصة 2026-0457» والأرقام في غير ترتيبها بعد الكلمة العربية. ما الإصلاح؟</p><ul><li><b>أ.</b> كتابة الرقم بالأرقام الهندية</li><li><b>ب.</b> &lt;span dir="ltr"&gt; حول الرقم وحده</li><li><b>ج.</b> جعل السطر كله dir="ltr"</li><li><b>د.</b> إضافة رمز تحكم خفي قبل الرقم وبعده</li></ul></li>
<li><p>رسالة مقاول في المحادثة: «ممكن reschedule للفحص؟». ماذا يحتاج الرد؟</p><ul><li><b>أ.</b> رد بالإنجليزية مثل الكلمة الإنجليزية في الرسالة</li><li><b>ب.</b> رد بالعربيزي ليطابق أسلوب المقاول</li><li><b>ج.</b> رد مزدوج بالعربية والإنجليزية دائمًا</li><li><b>د.</b> رد بالعربية، وفقاعة الرسالة dir="auto"</li></ul></li>
<li><p>سهم «رجوع» في واجهة عربية يُعكس ليشير إلى اليمين، أما علامة الصح فلا تُعكس.</p><ul><li><b>أ.</b> صح</li><li><b>ب.</b> خطأ</li></ul></li>
<li><p>أي مهمة تصلح لاختبار بوابة المقاولين دون أن تدل على الحل؟</p><ul><li><b>أ.</b> افتح «طلباتي» ثم «فحص الموقع» واحجز أول موعد</li><li><b>ب.</b> رتّب فحص الموقع الذي طلبه المهندس قبل الحفر</li><li><b>ج.</b> جرّب ميزة الحجز الجديدة وقل رأيك فيها</li><li><b>د.</b> هل تجد زر الحجز سهلًا؟</li></ul></li>
